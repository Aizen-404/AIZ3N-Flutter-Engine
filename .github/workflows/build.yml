name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            curl \
            python3 \
            ninja-build \
            pkg-config \
            clang \
            lld

      - name: Clone Flutter engine
        run: |
          git clone https://github.com/flutter/engine.git engine
          cd engine
          git fetch --depth=1 origin c4cd48e186460b32d44585ce3c103271ab676355
          git checkout c4cd48e186460b32d44585ce3c103271ab676355

      - name: Bootstrap engine
        working-directory: engine
        run: |
          ./tools/gn --help >/dev/null || true

      - name: Configure ARM64 release
        working-directory: engine
        run: |
          ./flutter/tools/gn \
            --runtime-mode release \
            --android \
            --android-cpu arm64

      - name: Build Flutter engine
        working-directory: engine
        run: |
          ninja -C out/android_release flutter/shell/platform/android:android

      - name: Locate libflutter
        run: |
          find engine/out -type f -name 'libflutter.so' -print

      - name: Package
        run: |
          mkdir -p artifact

          SO=$(find engine/out -type f -name 'libflutter.so' | head -1)

          if [ -z "$SO" ]; then
            echo "libflutter.so was not produced"
            exit 1
          fi

          cp "$SO" artifact/libflutter.so

          file artifact/libflutter.so
          readelf -h artifact/libflutter.so

          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
