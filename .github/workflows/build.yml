name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone reFlutter
        run: |
          git clone --depth=1 https://github.com/ptswarm/reFlutter.git

      - name: Pull builder
        run: |
          docker pull ptswarm/reflutter

      - name: Build ARM64 engine
        run: |
          cd reFlutter
          docker run \
            -e WAIT=300 \
            -e x64=0 \
            -e arm=0 \
            -e HASH_PATCH=ee1eb666c76a5cb7746faf39d0b97547 \
            -e COMMIT=c4cd48e186460b32d44585ce3c103271ab676355 \
            --rm \
            -i \
            -v "$PWD:/t" \
            ptswarm/reflutter

      - name: Find libflutter.so
        run: |
          echo "=== Searching for libflutter.so ==="
          find . -type f -name 'libflutter.so' -print

      - name: Package
        run: |
          mkdir -p artifact
          find . -type f -name 'libflutter.so' -exec cp {} artifact/libflutter.so \;
          file artifact/libflutter.so
          readelf -h artifact/libflutter.so | head -20
          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
