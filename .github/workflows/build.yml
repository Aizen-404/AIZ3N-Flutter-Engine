name: Build GoReSym ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Clone GoReSym
        run: |
          git clone --depth 1 https://github.com/mandiant/GoReSym.git
          cd GoReSym
          git rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build ARM64
        working-directory: GoReSym
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -ldflags="-s -w" -o GoReSym-linux-arm64 .

      - name: Verify ARM64
        working-directory: GoReSym
        run: |
          file GoReSym-linux-arm64
          readelf -h GoReSym-linux-arm64 | grep -E 'Class|Type|Machine'
          ls -lh GoReSym-linux-arm64

      - name: Package
        working-directory: GoReSym
        run: |
          tar -czf GoReSym-linux-arm64.tar.gz GoReSym-linux-arm64
          ls -lh GoReSym-linux-arm64.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoReSym-linux-arm64
          path: GoReSym/GoReSym-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
