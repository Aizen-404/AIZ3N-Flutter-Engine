name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull reFlutter builder
        run: |
          docker pull ptswarm/reflutter

      - name: Run custom engine builder
        run: |
          docker run \
            -e WAIT=300 \
            -e x64=0 \
            -e arm=0 \
            -e HASH_PATCH=ee1eb666c76a5cb7746faf39d0b97547 \
            -e COMMIT=c4cd48e186460b32d44585ce3c103271ab676355 \
            --rm \
            -i \
            -v "${GITHUB_WORKSPACE}:/t" \
            ptswarm/reflutter

      - name: Inspect output
        if: always()
        run: |
          echo "===== OUTPUT ====="
          find . -type f \
            \( -name 'libflutter.so' -o -name 'gen_snapshot' \) \
            -print

          echo
          echo "===== DIRECTORIES ====="
          find . -maxdepth 3 -type d -print | head -200

      - name: Package libflutter
        run: |
          SO=$(find . -type f -name 'libflutter.so' | head -1)

          if [ -z "$SO" ]; then
            echo "ERROR: builder did not produce libflutter.so"
            exit 1
          fi

          mkdir -p artifact
          cp "$SO" artifact/libflutter.so

          file artifact/libflutter.so
          readelf -h artifact/libflutter.so

          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
