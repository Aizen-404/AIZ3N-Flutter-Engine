name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            curl \
            ninja-build \
            pkg-config

      - name: Clone reFlutter
        run: |
          git clone --depth=1 https://github.com/ptswarm/reFlutter.git reFlutter

      - name: Install reFlutter with Python 3
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install ./reFlutter

      - name: Verify Python
        run: |
          python3 --version
          python3 -c "import sys; print(sys.executable)"
          python3 -m pip show reflutter

      - name: Build ARM64 engine
        env:
          HASH_PATCH: ee1eb666c76a5cb7746faf39d0b97547
          COMMIT: c4cd48e186460b32d44585ce3c103271ab676355
        run: |
          python3 -m src.__init__ \
            -h "$HASH_PATCH" \
            -c "$COMMIT"

      - name: Find libflutter.so
        run: |
          echo "=== libflutter.so ==="
          find . -type f -name 'libflutter.so' -print

      - name: Package
        run: |
          mkdir -p artifact

          find . -type f -name 'libflutter.so' \
            -exec cp {} artifact/libflutter.so \;

          file artifact/libflutter.so
          readelf -h artifact/libflutter.so

          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
