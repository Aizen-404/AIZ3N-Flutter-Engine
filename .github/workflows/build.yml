name: Build GoReSym ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout GoReSym
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Build ARM64
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          go build -o GoReSym-linux-arm64 .

      - name: Verify binary
        run: |
          file GoReSym-linux-arm64
          chmod +x GoReSym-linux-arm64
          ./GoReSym-linux-arm64 -about

      - name: Upload ARM64 binary
        uses: actions/upload-artifact@v4
        with:
          name: GoReSym-linux-arm64
          path: GoReSym-linux-arm64
