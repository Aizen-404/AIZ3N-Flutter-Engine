name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone reFlutter
        run: |
          git clone https://github.com/ptswarm/reFlutter.git reFlutter

      - name: Build reFlutter Docker image
        working-directory: reFlutter
        run: |
          docker build -t aiz3n-reflutter -f Dockerfile .

      - name: Build ARM64 engine
        working-directory: reFlutter
        run: |
          docker run \
            -e WAIT=1 \
            -e x64=0 \
            -e arm=0 \
            -e HASH_PATCH=ee1eb666c76a5cb7746faf39d0b97547 \
            -e COMMIT=c4cd48e186460b32d44585ce3c103271ab676355 \
            --rm \
            -v "$PWD:/t" \
            aiz3n-reflutter

      - name: Inspect engine
        if: always()
        working-directory: reFlutter
        run: |
          echo "=== engine/src ==="
          ls -la engine/src 2>/dev/null || true

          echo
          echo "=== GN ==="
          ls -la engine/src/flutter/tools/gn 2>/dev/null || true

          echo
          echo "=== libflutter.so ==="
          find engine -type f -name 'libflutter.so' -print 2>/dev/null || true

          echo
          echo "=== Android ARM64 outputs ==="
          find engine/src/out -type f \
            \( -name 'libflutter.so' -o -name 'gen_snapshot' \) \
            -print 2>/dev/null || true

      - name: Package
        run: |
          SO=$(find reFlutter/engine -type f -name 'libflutter.so' | head -1)

          if [ -z "$SO" ]; then
            echo "ERROR: libflutter.so was not produced."
            echo
            echo "The complete Docker/build log above is the important part."
            exit 1
          fi

          mkdir -p artifact
          cp "$SO" artifact/libflutter.so

          file artifact/libflutter.so
          readelf -h artifact/libflutter.so

          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload engine
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
