name: Build GoReSym ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Clone GoReSym
        run: |
          set -euxo pipefail

          git clone --depth=1 \
            https://github.com/mandiant/GoReSym.git \
            "$HOME/GoReSym"

          cd "$HOME/GoReSym"

          git rev-parse HEAD

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Build GoReSym ARM64
        run: |
          set -euxo pipefail

          cd "$HOME/GoReSym"

          export GOOS=linux
          export GOARCH=arm64
          export CGO_ENABLED=0

          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o GoReSym-linux-arm64 \
            .

      - name: Verify ARM64 executable
        run: |
          set -euxo pipefail

          cd "$HOME/GoReSym"

          echo "=== FILE ==="
          file GoReSym-linux-arm64

          echo "=== ELF HEADER ==="
          readelf -h GoReSym-linux-arm64

          echo "=== ARCHITECTURE ==="
          readelf -h GoReSym-linux-arm64 \
            | grep -E "Class|Type|Machine"

          echo "=== SIZE ==="
          ls -lh GoReSym-linux-arm64

          echo "=== SHA256 ==="
          sha256sum GoReSym-linux-arm64

          echo "=== VERIFY ARM64 ==="

          file GoReSym-linux-arm64 \
            | grep -E "ELF 64-bit.*ARM aarch64"

      - name: Package
        run: |
          set -euxo pipefail

          cd "$HOME/GoReSym"

          tar -czf \
            "$GITHUB_WORKSPACE/GoReSym-linux-arm64.tar.gz" \
            GoReSym-linux-arm64

          ls -lh \
            "$GITHUB_WORKSPACE/GoReSym-linux-arm64.tar.gz"

      - name: Upload GoReSym ARM64
        uses: actions/upload-artifact@v4
        with:
          name: GoReSym-linux-arm64
          path: |
            GoReSym-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30
