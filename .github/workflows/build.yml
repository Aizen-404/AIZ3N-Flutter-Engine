name: AIZ3N Flutter Engine

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout AIZ3N project
        uses: actions/checkout@v4

      - name: Clone current reFlutter
        run: |
          git clone --depth=1 https://github.com/Impact-I/reFlutter.git reFlutter

      - name: Patch Perfetto dependency before build
        working-directory: reFlutter
        run: |
          python3 - <<'PY'
          from pathlib import Path

          dockerfile = Path("Dockerfile")
          data = dockerfile.read_text()

          old = "gclient sync"
          new = "sed -i 's#https://fuchsia.googlesource.com/third_party/android.googlesource.com/platform/external/perfetto#https://android.googlesource.com/platform/external/perfetto#g' /engine/DEPS && gclient sync"

          if old not in data:
              raise SystemExit(
                  "ERROR: Could not find 'gclient sync' in reFlutter Dockerfile."
              )

          data = data.replace(old, new, 1)
          dockerfile.write_text(data)

          print("=== Patched Dockerfile ===")
          print(new)
          PY

          grep -n -C 3 "gclient sync" Dockerfile

      - name: Build reFlutter Docker image
        working-directory: reFlutter
        run: |
          docker build \
            -t aiz3n-reflutter \
            -f Dockerfile .

      - name: Build Flutter ARM64 engine
        working-directory: reFlutter
        run: |
          docker run \
            -e WAIT=1 \
            -e x64=0 \
            -e arm=0 \
            -e HASH_PATCH=ee1eb666c76a5cb7746faf39d0b97547 \
            -e COMMIT=c4cd48e186460b32d44585ce3c103271ab676355 \
            --rm \
            -v "${GITHUB_WORKSPACE}/reFlutter:/t" \
            aiz3n-reflutter

      - name: Locate engine
        if: always()
        run: |
          echo "=== libflutter.so ==="
          find reFlutter -type f -name 'libflutter.so' -print

          echo "=== engine directories ==="
          find reFlutter -maxdepth 6 \
            \( -type d -name 'src' -o -type d -name 'out' \) \
            -print

      - name: Package
        run: |
          set -e

          SO=$(find reFlutter -type f -name 'libflutter.so' | head -1)

          if [ -z "$SO" ]; then
            echo "ERROR: libflutter.so was not produced."
            exit 1
          fi

          echo "Found:"
          echo "$SO"

          mkdir -p artifact

          cp "$SO" artifact/libflutter.so

          echo "=== ELF ==="
          file artifact/libflutter.so

          echo "=== ELF header ==="
          readelf -h artifact/libflutter.so

          echo "=== SHA256 ==="
          sha256sum artifact/libflutter.so

          tar -czf AIZ3N-libflutter-arm64.tar.gz artifact

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AIZ3N-libflutter-arm64
          path: AIZ3N-libflutter-arm64.tar.gz
          if-no-files-found: error
